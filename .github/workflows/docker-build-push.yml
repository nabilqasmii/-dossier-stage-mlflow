name: Build and push MLflow image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: mlflow-tracking
  # Chemin image Quay = quay.io/<namespace>/<repo> (sans le "+" du robot)
  QUAY_NAMESPACE: nqasmi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            quay.io/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            quay.io/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
